version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: spaceship-titanic-api:latest
    container_name: spaceship_titanic_api
    ports:
      - "8000:8000"
    volumes:
      # Mount the MLflow SQLite database so the container shares the tracking store
      - ../mlflow.db:/app/mlflow.db
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
